<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />

  <!-- Inner Ambient Glow -->
  <circle cx="32" cy="30" r="18" fill="#6366f1" opacity="0.25" filter="url(#glow)" />

  <!-- Graduation Cap (Campus) -->
  <path d="M32 14 L52 23 L32 32 L12 23 Z" fill="url(#capGrad)" filter="url(#glow)" />
  <path d="M32 16.5 L47 23 L32 29.5 L17 23 Z" fill="#0f172a" opacity="0.3" />

  <!-- Cap Base & Skullcap Arch -->
  <path d="M20 27.5 V35 C20 39.5 25.5 43 32 43 C38.5 43 44 39.5 44 35 V27.5" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- AI Copilot Pulse Spark / Diamond Center -->
  <circle cx="32" cy="35" r="3" fill="#38bdf8" filter="url(#glow)" />
  <path d="M32 29 L33.5 33.5 L38 35 L33.5 36.5 L32 41 L30.5 36.5 L26 35 L30.5 33.5 Z" fill="#ffffff" opacity="0.9" />

  <!-- Tassel / Wings Line -->
  <path d="M47 24.5 V35 C47 37 49 38 50 39" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="50" cy="39" r="1.5" fill="#38bdf8" />

  <!-- Floating Sparkles -->
  <circle cx="16" cy="16" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="48" cy="14" r="1" fill="#c084fc" opacity="0.8" />
</svg>